<!DOCTYPE html>
<html lang="ja">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>デジタルスタンプラリー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#faf5ec; --card:#fffdf8; --ink:#1f2a44; --muted:#6b6f7b; --line:#e7dcc8;
    --red:#c8372d; --red-soft:#f7e1dc; --gold:#c8901f; --gold-soft:#fbefd6; --gold-ink:#7a5200; --indigo:#2d3e6b; --blue:#1f5fbf;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--paper);color:var(--ink);
    font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;
    -webkit-text-size-adjust:100%}
  .wrap{max-width:520px;margin:0 auto;padding:0 16px 120px}
  header.hero{background:var(--indigo);color:#fff;padding:22px 16px 26px;text-align:center;position:relative;overflow:hidden}
  header.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:10px;
    background:repeating-linear-gradient(90deg,var(--red) 0 18px,#fff 18px 36px)}
  .eyebrow{font-size:11px;letter-spacing:.25em;opacity:.75}
  h1{font-size:21px;margin:6px 0 0;font-weight:900;line-height:1.35}
  h1 .ln{display:block;white-space:nowrap}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-top:16px}
  h2{font-size:16px;margin:0 0 12px;font-weight:900}
  label{display:block;font-size:14px;font-weight:700;margin:16px 0 6px}
  label .hint{font-weight:700;color:var(--red);font-size:12px;margin-left:4px}
  input[type=text],input[type=tel],input[type=number]{width:100%;font:inherit;font-size:18px;padding:12px 14px;
    border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
  input:focus{outline:none;border-color:var(--indigo)}
  .note{font-size:12.5px;color:var(--muted);line-height:1.6}
  .consent{display:flex;gap:10px;align-items:flex-start;margin-top:16px;font-size:13px;line-height:1.6}
  .consent input{width:22px;height:22px;margin-top:1px;flex:none}
  .btn{display:block;width:100%;margin-top:18px;padding:15px;border:0;border-radius:12px;font:inherit;font-weight:900;
    font-size:17px;background:var(--red);color:#fff;cursor:pointer;text-align:center;text-decoration:none}
  .btn:disabled{opacity:.5}
  .btn.ghost{background:transparent;color:var(--indigo);border:1.5px solid var(--line);font-size:14px;padding:12px}
  .req{color:var(--red);font-weight:900;margin-left:3px}
  .err{color:var(--red);font-size:13.5px;margin-top:10px;min-height:1em;font-weight:700;line-height:1.5}
  .loading{text-align:center;padding:60px 0;color:var(--muted)}

  /* ---- 新規登録（⑤） ---- */
  .newbie{border:3px solid var(--red);background:#fff;padding:0;overflow:hidden}
  .newbie .top{background:var(--red);color:#fff;padding:16px 18px;text-align:center}
  .newbie .top .tag{display:inline-block;background:#fff;color:var(--red);font-weight:900;font-size:13px;border-radius:999px;padding:3px 12px}
  .newbie .top .big{font-size:22px;font-weight:900;margin-top:8px;line-height:1.35}
  .newbie .top .sub{font-size:13px;margin-top:6px;opacity:.95;line-height:1.5}
  .newbie .body{padding:4px 18px 20px}
  .steps{display:flex;gap:6px;margin:14px 0 4px;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--muted)}
  .steps b{background:var(--indigo);color:#fff;border-radius:999px;padding:3px 10px;font-size:12px}
  .shopflag{margin:12px 0 0;background:var(--gold-soft);border-radius:10px;padding:10px 12px;font-size:13.5px;font-weight:700;line-height:1.5;text-align:center}
  .shopflag .sn{font-size:18px;font-weight:900}
  .choice-lead{text-align:center;font-size:15px;font-weight:700;margin:22px 0 4px;line-height:1.6}
  .choice{display:block;width:100%;margin-top:14px;padding:20px 18px;border:0;border-radius:18px;color:#fff;font:inherit;text-align:left;
    cursor:pointer;box-shadow:0 6px 16px rgba(31,42,68,.18);display:flex;align-items:center;gap:14px}
  .choice.new{background:var(--red)} .choice.back{background:var(--blue)}
  .choice .ic{flex:none;width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-size:26px}
  .choice .t1{font-size:22px;font-weight:900;line-height:1.3}
  .choice .t2{font-size:13px;opacity:.92;margin-top:4px;line-height:1.5}
  .choice .t2 span{display:inline-block}
  .choice .arw{margin-left:auto;font-size:26px;font-weight:900;opacity:.9}
  .backlink{display:inline-flex;align-items:center;gap:6px;margin-top:16px;background:none;border:0;color:var(--indigo);font:inherit;font-weight:700;font-size:15px;cursor:pointer;padding:6px 0}
  .returner{border:3px solid var(--blue);background:#fff;padding:0;overflow:hidden}
  .returner .top{background:var(--blue);color:#fff;padding:16px 18px;text-align:center}
  .returner .top .tag{display:inline-block;background:#fff;color:var(--blue);font-weight:900;font-size:13px;border-radius:999px;padding:3px 12px}
  .returner .top .big{font-size:22px;font-weight:900;margin-top:8px;line-height:1.35}
  .returner .top .sub{font-size:13px;margin-top:6px;opacity:.95;line-height:1.5}
  .returner .body{padding:4px 18px 20px}
  .btn.blue{background:var(--blue)}
  .linkbtn{display:block;width:100%;margin-top:12px;background:none;border:0;color:var(--indigo);text-decoration:underline;font:inherit;font-size:14px;cursor:pointer}

  .member{display:flex;justify-content:space-between;align-items:center;gap:12px}
  .member .no{font-size:28px;font-weight:900;letter-spacing:.06em;font-variant-numeric:tabular-nums}
  .member .nm{font-size:14px;color:var(--muted)}
  .member .code{font-size:11px;color:var(--muted);text-align:right;line-height:1.5}

  .progress-top{display:flex;align-items:baseline;justify-content:space-between}
  .count{font-size:44px;font-weight:900;color:var(--red);line-height:1;font-variant-numeric:tabular-nums}
  .count small{font-size:16px;color:var(--muted);font-weight:700}
  .bar{position:relative;height:14px;border-radius:7px;background:#efe6d6;margin:16px 0 30px}
  .bar .fill{position:absolute;inset:0 auto 0 0;border-radius:7px;background:var(--red);transition:width .6s}
  .bar .mk{position:absolute;top:-4px;width:3px;height:22px;background:var(--gold);border-radius:2px}
  .bar .mk span{position:absolute;top:24px;left:50%;transform:translateX(-50%);font-size:11px;white-space:nowrap;color:var(--muted);font-weight:700}
  .rules{border-radius:14px;background:#f6f0e4;padding:12px;margin:2px 0 6px}
  .rules .ttl{font-size:12px;font-weight:900;color:var(--muted);letter-spacing:.06em;margin:0 0 8px}
  .coins{display:grid;grid-template-columns:1fr;gap:8px}
  .coin{display:flex;align-items:center;gap:12px;background:#fff;border-radius:12px;padding:8px 12px;border:2px solid var(--line)}
  .coin.gold{border-color:#e2c27a;background:#fffaf0}
  .coin .c{flex:none;width:46px;height:46px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;line-height:1}
  .coin .c b{font-size:20px} .coin .c small{font-size:9px;margin-top:1px}
  .coin.gold .c{color:#fff;background:radial-gradient(circle at 35% 30%,#f3cf72,#c8901f 70%);border:2px solid #b47a12}
  .coin.std .c{color:var(--red);background:var(--red-soft);border:2px solid var(--red)}
  .coin .l1{font-size:15px;font-weight:900;line-height:1.3}
  .coin .l2{font-size:13px;color:var(--muted);margin-top:2px;line-height:1.35}
  .coin .l2 b{color:var(--ink);font-size:15px}
  .coin.gold .l2 b{color:var(--gold-ink)} .coin.std .l2 b{color:var(--red)}
  .prizes{margin-top:10px;background:#fff;border-radius:12px;padding:10px 12px;border:2px solid var(--line)}
  .prizes .row{display:flex;flex-wrap:wrap;align-items:center;column-gap:6px;row-gap:2px;font-size:min(14px,3.75vw);font-weight:700;margin:5px 0}
  .nw{display:inline-block;white-space:nowrap}
  .prizes .row b{display:inline-block;min-width:50px;text-align:center;background:var(--indigo);color:#fff;border-radius:999px;padding:2px 8px;font-size:13px}
  .prizes .row.done b{background:var(--gold)}
  .prizes .max{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-size:13px;font-weight:900;color:var(--red);line-height:1.5}
  .prizes .max small{display:block;font-weight:700;color:var(--muted);font-size:11.5px}
  .allgot{margin-top:10px;text-align:center;font-weight:900;color:var(--gold-ink);background:var(--gold-soft);border-radius:12px;padding:10px;font-size:14px;line-height:1.5}
  .cell .dot .ptx{font-size:11px;font-weight:900}

  .ticket{position:relative;border-radius:14px;padding:14px 16px;margin-top:10px;display:flex;justify-content:space-between;align-items:center;gap:10px}
  .ticket.on{background:var(--gold-soft);border:2px solid var(--gold)}
  .ticket.on .t1{color:var(--gold-ink)}
  .ticket.used{background:#f0eeea;border:2px solid #d8d4cc;color:#8a8a8a}
  .ticket.lock{border:2px dashed var(--line);color:var(--muted)}
  .ticket .t1{font-size:min(12px,3.4vw);font-weight:700}
  .ticket .t2{font-size:min(18px,4.4vw);font-weight:900;margin-top:2px}
  .ticket .t3{font-size:12px;margin-top:4px;line-height:1.5}
  .ticket .usedmark{border:3px solid #a33;color:#a33;border-radius:8px;padding:4px 8px;font-weight:900;font-size:16px;transform:rotate(-12deg);flex:none;background:rgba(255,255,255,.6)}
  .ticket .go{flex:none;font-size:24px}

  .sec{display:flex;align-items:baseline;justify-content:space-between;margin:4px 0 10px}
  .sec h2{margin:0}
  .sec .pt{font-size:12px;font-weight:900;border-radius:999px;padding:3px 10px}
  .sec .pt.gold{background:var(--gold);color:#fff}
  .sec .pt.std{background:var(--red-soft);color:var(--red)}
  .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
  .cell{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
  .dot{width:100%;aspect-ratio:1;border-radius:50%;border:1.5px dashed #d6cab3;display:flex;align-items:center;justify-content:center;
    font-size:13px;font-weight:700;color:#b3a78f;font-variant-numeric:tabular-nums}
  .cell.on .dot{border:2.5px solid var(--red);color:var(--red);background:var(--red-soft);font-size:15px;font-weight:900}
  .cell.gold .dot{border-color:#e2c27a;color:#c9a65a;background:#fffaf0}
  .cell.gold.on .dot{border:2.5px solid var(--gold);color:#fff;background:linear-gradient(135deg,#e7b54a,#b47a12);font-size:13px}
  .cell .sn{font-size:9.5px;line-height:1.2;color:var(--muted);text-align:center;width:100%;overflow:hidden;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;min-height:2.4em}
  .cell.on .sn{color:var(--ink)}

  /* ---- 下部固定のカメラボタン（④） ---- */
  .scanbar{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom));
    background:linear-gradient(to top,var(--paper) 70%,rgba(250,245,236,0));z-index:5}
  .scanbtn{display:flex;align-items:center;justify-content:center;gap:10px;max-width:488px;margin:0 auto;width:100%;
    padding:16px;border:0;border-radius:14px;background:var(--indigo);color:#fff;font:inherit;font-size:18px;font-weight:900;
    box-shadow:0 6px 18px rgba(31,42,68,.3);cursor:pointer}
  .scanbtn svg{width:26px;height:26px;flex:none}

  /* ---- スキャナー ---- */
  .scanner{position:fixed;inset:0;background:#000;z-index:20;display:flex;flex-direction:column;color:#fff}
  .scanner video{flex:1;width:100%;object-fit:cover;min-height:0}
  .scanner .frame{position:absolute;left:50%;top:42%;width:min(70vw,300px);aspect-ratio:1;transform:translate(-50%,-50%);
    border-radius:18px;box-shadow:0 0 0 9999px rgba(0,0,0,.45);border:3px solid #fff}
  .scanner .msg{position:absolute;left:0;right:0;top:calc(42% + min(35vw,150px) + 18px);text-align:center;font-weight:700;font-size:15px;padding:0 20px;line-height:1.5}
  .scanner .foot{padding:14px 16px calc(14px + env(safe-area-inset-bottom));background:#000;display:flex;gap:10px}
  .scanner .foot button,.scanner .foot label{flex:1;margin:0;padding:14px;border-radius:12px;border:1.5px solid #fff;background:transparent;color:#fff;font:inherit;font-weight:900;font-size:15px;text-align:center;cursor:pointer}
  .scanner .fallback{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;gap:14px;background:var(--indigo)}
  .scanner .fallback p{margin:0;line-height:1.7;font-size:15px}

  /* ---- スタンプ結果（③） ---- */
  .overlay{position:fixed;inset:0;background:rgba(31,42,68,.6);display:flex;align-items:center;justify-content:center;z-index:10;padding:20px;overflow:auto}
  .modal{background:var(--card);border-radius:22px;padding:24px 20px 20px;max-width:380px;width:100%;text-align:center}
  .modal.gold{background:linear-gradient(180deg,#fff6df,#fffdf8 45%)}
  .thanks{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.08em}
  .shopname{font-size:30px;font-weight:900;line-height:1.25;margin:8px 0 4px;word-break:break-word;color:var(--ink)}
  .shopname.long{font-size:24px}
  .shopsama{font-size:14px;font-weight:700;color:var(--muted)}
  .typebadge{display:inline-block;margin-top:10px;font-size:12px;font-weight:900;border-radius:999px;padding:4px 12px}
  .typebadge.gold{background:var(--gold);color:#fff}
  .typebadge.std{background:var(--red-soft);color:var(--red)}
  .bigstamp{width:124px;height:124px;margin:16px auto 10px;border-radius:50%;border:6px double var(--red);color:var(--red);
    display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;transform:rotate(-8deg);
    animation:press .45s cubic-bezier(.2,1.6,.4,1) both}
  .bigstamp .s1{font-size:34px;line-height:1}
  .bigstamp .s2{font-size:15px;margin-top:4px;letter-spacing:.05em}
  .bigstamp.gold{border-color:var(--gold);color:#fff;background:radial-gradient(circle at 35% 30%,#f3cf72,#c8901f 70%)}
  .bigstamp.gray{border-color:#aaa;color:#888}
  @keyframes press{from{transform:scale(2.2) rotate(-8deg);opacity:0}to{transform:scale(1) rotate(-8deg);opacity:1}}
  .modal h3{margin:4px 0 6px;font-size:18px}
  .modal p{margin:0;font-size:14px;color:var(--muted);line-height:1.6}
  .total{margin-top:8px;font-size:15px;font-weight:700}
  .total b{font-size:22px;color:var(--red)}
  .prize{margin-top:14px;background:var(--gold-soft);border:2px solid var(--gold);border-radius:12px;padding:12px;font-weight:900;color:var(--gold-ink);line-height:1.5}
</style>
</head>
<body>
<header class="hero">
  <div class="eyebrow">DIGITAL STAMP RALLY</div>
  <h1 id="title"></h1>
</header>
<main class="wrap" id="app"><div class="loading">読み込み中…</div></main>
<div id="layer"></div>
<div id="scan"></div>

<!-- Apps Script で開いたときだけ、ここに設定が入ります（GitHub Pages では空のまま） -->
<script type="application/json" id="boot"><?!= boot ?></script>
<script>
// ▼▼▼ ここに Apps Script の「ウェブアプリのURL」を貼り付けてください ▼▼▼
const API_URL = 'https:\/\/script.google.com/macros/s/AKfycbxzjAEfGum3OQuw1-mdhwzGIRyu374MTTVZI1EwNpuBTGHJ1-S0W_Cj6r1zsEDSPmw8Iw/exec';
// ▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲

const IN_GAS = !!(window.google && google.script && google.script.run);
let GAS_BOOT = {};
try{ GAS_BOOT = JSON.parse(document.getElementById('boot').textContent) || {}; }catch(e){}
const _q = new URLSearchParams(location.search);
const BOOT = {
  eventName: GAS_BOOT.eventName || '', privacy:'', tiers:[], shopInfo:null,
  frontUrl: IN_GAS ? (GAS_BOOT.frontUrl || '') : '',
  shop: GAS_BOOT.shop || _q.get('shop') || '', k: GAS_BOOT.k || _q.get('k') || '', t: GAS_BOOT.t || _q.get('t') || '',
};
const LS_KEY = 'shotengai_rally_token';
const $app = document.getElementById('app');
const $layer = document.getElementById('layer');
const $scan = document.getElementById('scan');
// タイトルは全角/半角スペースの位置で改行し、各行が画面幅に収まる大きさにする
function setTitle(name){
  const h=document.getElementById('title'); h.textContent='';
  const parts=String(name||'').split(/[\s　]+/).filter(Boolean);
  // 半角英数字は全角の約0.6文字分として行の長さを計算
  const w=t=>[...t].reduce((a,c)=>a+(/[\x20-\x7e]/.test(c)?0.6:1),0);
  const longest=Math.max(1,...parts.map(w));
  h.style.fontSize='min(22px, calc((100vw - 48px) / '+(longest+0.3).toFixed(1)+'))';
  parts.forEach(t=>{ const sp=document.createElement('span'); sp.className='ln'; sp.textContent=t; h.appendChild(sp); });
}
setTitle(BOOT.eventName);

let currentToken = '';
let lastCard = null;

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
// 端末に会員の合言葉を保存（localStorage と Cookie の二重保存）
function getToken(){
  let t=''; try{t=localStorage.getItem(LS_KEY)||'';}catch(e){}
  if(!t){ const m=document.cookie.match(/(?:^|; )rally_t=([^;]+)/); if(m) t=decodeURIComponent(m[1]); }
  return t;
}
function setToken(t){
  try{t?localStorage.setItem(LS_KEY,t):localStorage.removeItem(LS_KEY);}catch(e){}
  try{document.cookie='rally_t='+(t?encodeURIComponent(t):'')+';path=/;max-age='+(t?60*60*24*365:0)+';SameSite=Lax'+(location.protocol==='https:'?';Secure':'');}catch(e){}
}
// Apps Script（データ保存側）との通信
async function run(fn){
  const args=[].slice.call(arguments,1);
  if(IN_GAS){
    return new Promise((res,rej)=>{google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn].apply(null,args);});
  }
  const action=fn.replace(/^api/,'').replace(/^./,ch=>ch.toLowerCase());
  const res=await fetch(API_URL,{method:'POST',body:JSON.stringify({action:action,args:args})});
  if(!res.ok) throw new Error('通信エラー（'+res.status+'）');
  const text=await res.text();
  try{ return JSON.parse(text); }
  catch(e){ throw new Error('サーバーに接続できませんでした。時間をおいて再度お試しください。（運営者の方へ：card.html の API_URL と、Apps Script のデプロイ設定「アクセスできるユーザー：全員」を確認してください）'); }
}
function keepUrl(token){
  // アドレスにカードの合言葉を残す（ブックマークで同じカードを開けるように）
  try{
    if(IN_GAS) google.script.history.replace(null,{t:token});
    else history.replaceState(null,'',location.pathname+'?t='+encodeURIComponent(token));
  }catch(e){}
}

async function start(){
  if(BOOT.frontUrl){
    const q=new URLSearchParams(); ['shop','k','t'].forEach(n=>{ if(BOOT[n]) q.set(n,BOOT[n]); });
    const url=BOOT.frontUrl+(q.toString()?'?'+q.toString():'');
    $app.innerHTML='<div class="panel" style="text-align:center"><h2>スタンプカードはこちら</h2><a class="btn" target="_top" href="'+esc(url)+'">スタンプカードを開く</a></div>';
    return;
  }
  try{
    const cfg=await run('apiConfig', BOOT.shop);
    if(!cfg || !cfg.eventName) throw new Error((cfg&&cfg.error)||'設定を読み込めませんでした');
    BOOT.eventName=cfg.eventName; BOOT.privacy=cfg.privacy; BOOT.tiers=cfg.tiers; BOOT.shopInfo=cfg.shop;
    setTitle(cfg.eventName); document.title=cfg.eventName;
  }catch(e){ renderError(e); return; }
  if(BOOT.t) setToken(BOOT.t);
  currentToken = getToken();
  if(!currentToken){ renderStart(); return; }
  if(BOOT.shop){ await stamp(BOOT.shop, BOOT.k); } else { await loadCard(); }
}

async function loadCard(){
  try{
    const r = await run('apiCard', currentToken);
    if(r.error==='NOT_FOUND'){ setToken(''); currentToken=''; renderStart(); return; }
    if(r.error){ renderError(r.error); return; }
    keepUrl(currentToken);
    renderCard(r.card);
  }catch(e){ renderError(e); }
}

async function stamp(shop, k){
  $layer.innerHTML='';
  $app.innerHTML='<div class="loading">スタンプを押しています…</div>';
  try{
    const r = await run('apiStamp', currentToken, shop, k);
    if(r.error==='NOT_FOUND'){ setToken(''); currentToken=''; BOOT.shop=shop; BOOT.k=k; renderStart(); return; }
    if(r.error){ renderError(r.error); return; }
    BOOT.shop=''; BOOT.k='';
    keepUrl(currentToken);
    renderCard(r.card);
    showResult(r);
  }catch(e){ renderError(e); }
}

function renderError(e){
  $app.innerHTML='<div class="panel"><h2>うまく読み込めませんでした</h2><p class="note">'+esc(e&&e.message?e.message:e)+'</p><button class="btn" onclick="location.reload()">もう一度読み込む</button></div>';
}

// ---------- 電話番号（ハイフンなし11桁） ----------
function toHalf(s){return String(s||'').replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0));}
function phoneDigits(s){ let d=toHalf(s).replace(/\D/g,''); if(/^81[1-9]\d{9}$/.test(d)) d='0'+d.slice(2); return d; }
function checkPhone(s){ return /^0\d{10}$/.test(phoneDigits(s)) ? '' : '電話番号はハイフンなしの11桁で入力してください（例：09012345678）。'; }

// ---------- 抽選券の一覧（20pt→1枚、30pt→2枚 など） ----------
function ticketSlots(tiers){
  const out=[]; (tiers||[]).forEach(t=>{ for(let i=1;i<=t.draws;i++) out.push({points:t.points, seq:i}); }); return out;
}

// ---------- スタンプカード ----------
// ポイントのルール（スタンプの種類と抽選券のもらい方）
function rulesHtml(card, pts){
  const coins = card.types.map(t=>`<div class="coin ${t.type==='gold'?'gold':'std'}">
      <div class="c"><b>${t.points}</b><small>ポイント</small></div>
      <div><div class="l1">${t.type==='gold'?'★ ':''}${esc(t.label)}のお店</div><div class="l2"><span class="nw">スタンプ1つで</span> <b class="nw">${t.points}ポイント</b></div></div></div>`).join('');
  const slots = ticketSlots(card.tiers);
  let n=0;
  const rows = card.tiers.map(t=>{
    const from=n+1; n+=t.draws;
    const label = t.draws===1 ? `抽選券 ${from}枚目` : `抽選券 ${from}〜${n}枚目`;
    return `<div class="row ${pts>=t.points?'done':''}"><b>${t.points}pt</b><span class="nw">${pts>=t.points?'✓ ':''}${label}</span><span class="nw">がもらえる</span></div>`;
  }).join('');
  const lastPt = card.tiers.length ? card.tiers[card.tiers.length-1].points : 0;
  return `<div class="rules">
    <div class="ttl">ポイントのため方</div>
    <div class="coins">${coins}</div>
    <div class="prizes">${rows}
      <div class="max">抽選券は1人 最大${slots.length}枚まで<small><span style="display:inline-block">${lastPt}ポイントを超えて集めても、</span><span style="display:inline-block">抽選券は増えません</span></small></div>
    </div></div>`;
}

function renderCard(card){
  if(!card || !card.types || card.points===undefined){ renderError('サーバー側（Apps Script）が古いバージョンのままです。（運営者の方へ：Code.gs を貼り替えて「新バージョン」でデプロイしてください）'); return; }
  lastCard = card;
  const stampedSet = {}; card.stamped.forEach(s=>stampedSet[s.shop]=s.at);
  const pts = card.points;
  const maxPts = card.shops.reduce((a,s)=>a+s.points,0);
  const lastTier = card.tiers.length ? card.tiers[card.tiers.length-1].points : 0;
  const scale = Math.max(lastTier + 5, Math.min(maxPts, lastTier * 1.5)) || 1;
  const pct = Math.min(100, pts/scale*100);
  const markers = card.tiers.map(t=>`<div class="mk" style="left:calc(${Math.min(100,t.points/scale*100)}% - 1.5px)"><span>${t.points}pt 🎁</span></div>`).join('');

  const maxTickets = ticketSlots(card.tiers).length;
  const rightsMap = {}; card.rights.forEach(r=>rightsMap[r.tier+'-'+r.seq]=r);
  const tickets = ticketSlots(card.tiers).map((s,i)=>{
    const r = rightsMap[s.points+'-'+s.seq];
    const no = `抽選券 ${i+1}枚目（${s.points}ポイント達成）`;
    if(!r) return `<div class="ticket lock"><div><div class="t1">${no}</div><div class="t2">${s.points}ポイントでもらえます</div><div class="t3">あと ${Math.max(0,s.points-pts)} ポイント</div></div><div class="go">🔒</div></div>`;
    if(r.status==='使用済み') return `<div class="ticket used"><div><div class="t1">${no}</div><div class="t2">抽選済み</div><div class="t3">${esc(r.usedAt)}</div></div><div class="usedmark">使用済</div></div>`;
    return `<div class="ticket on"><div><div class="t1">${no}</div><div class="t2">抽選できます！</div><div class="t3">商店街本部でこの画面をスタッフにお見せください</div></div><div class="go">🎁</div></div>`;
  }).join('');

  const sections = card.types.map(t=>{
    const list = card.shops.filter(s=>s.type===t.type);
    if(!list.length) return '';
    const got = list.filter(s=>stampedSet[s.id]).length;
    const cells = list.map((s,i)=>{
      const on = !!stampedSet[s.id];
      return `<div class="cell ${t.type==='gold'?'gold':''} ${on?'on':''}"><div class="dot">${on?(t.type==='gold'?'★'+t.points:'済'):`<span class="ptx">${t.points}pt</span>`}</div><div class="sn">${esc(s.name)}</div></div>`;
    }).join('');
    return `<div class="panel"><div class="sec"><h2>${esc(t.label)}スタンプ <span class="note">${got}/${list.length}</span></h2><span class="pt ${t.type==='gold'?'gold':'std'}">1つ ${t.points}ポイント</span></div><div class="grid">${cells}</div></div>`;
  }).join('');

  $app.innerHTML = `
  <div class="panel member">
    <div><div class="nm">会員番号</div><div class="no">${esc(card.member.id)}</div><div class="nm">${esc(card.member.name)} 様</div></div>
    <div class="code">別のスマホで開くときは<br><b style="font-size:12px;color:var(--ink)">電話番号＋年齢</b><br>で開けます</div>
  </div>
  <div class="panel">
    <div class="progress-top"><h2 style="margin:0">いまのポイント</h2><div class="count">${pts}<small> pt</small></div></div>
    <div class="bar"><div class="fill" style="width:${pct}%"></div>${markers}</div>
    ${rulesHtml(card, pts)}
    ${tickets}
    ${pts>=lastTier && lastTier ? `<div class="allgot">🎉 抽選券はすべてもらいました（最大${maxTickets}枚）<br><span style="font-weight:700;font-size:12px">これ以上ポイントを集めても抽選券は増えません</span></div>` : ''}
  </div>
  ${sections}
  <p class="note" style="text-align:center;margin-top:18px">このページをブックマークしておくと、すぐにカードを開けます。</p>
  <div class="scanbar"><button class="scanbtn" onclick="openScanner()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"/><circle cx="12" cy="12" r="3.2"/></svg>
    次のお店のQRを読み取る</button></div>`;
}

// ---------- QR読み取り（④） ----------
let scanStream=null, scanTimer=null, detector=null;
const JSQR_URLS=['https:\/\/cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js','https:\/\/unpkg.com/jsqr@1.4.0/dist/jsQR.js'];
async function loadJsQR(){
  for(const u of JSQR_URLS){
    if(window.jsQR) return;
    try{
      await new Promise((res,rej)=>{
        const s=document.createElement('script'); s.src=u;
        s.onload=()=>window.jsQR?res():rej(); s.onerror=rej;
        document.head.appendChild(s);
      });
    }catch(e){}
  }
  if(!window.jsQR) throw new Error('読み取り部品を読み込めませんでした');
}
function parseShopQR(text){
  try{
    const u=new URL(String(text).trim());
    const shop=u.searchParams.get('shop'), k=u.searchParams.get('k');
    return shop&&k ? {shop,k} : null;
  }catch(e){ return null; }
}
async function decodeFrame(src, w, h){
  if(detector){
    try{ const codes=await detector.detect(src); if(codes&&codes[0]) return codes[0].rawValue; }catch(e){}
  }
  if(window.jsQR){
    const c=decodeFrame.c||(decodeFrame.c=document.createElement('canvas'));
    const scale=Math.min(1, 720/Math.max(w,h));
    c.width=Math.round(w*scale); c.height=Math.round(h*scale);
    const ctx=c.getContext('2d',{willReadFrequently:true});
    ctx.drawImage(src,0,0,c.width,c.height);
    const img=ctx.getImageData(0,0,c.width,c.height);
    const r=jsQR(img.data,img.width,img.height,{inversionAttempts:'dontInvert'});
    if(r) return r.data;
  }
  return null;
}
function onScanned(text){
  const q=parseShopQR(text);
  if(!q){ setScanMsg('スタンプラリーのQRコードではないようです。お店に掲示されたQRを写してください。'); return false; }
  closeScanner(); stamp(q.shop, q.k); return true;
}
function setScanMsg(t){ const m=document.getElementById('scan-msg'); if(m) m.textContent=t; }

async function openScanner(){
  if('BarcodeDetector' in window){
    try{ const f=await BarcodeDetector.getSupportedFormats(); if(f.indexOf('qr_code')>=0) detector=new BarcodeDetector({formats:['qr_code']}); }catch(e){}
  }
  if(!detector){ try{ await loadJsQR(); }catch(e){} }
  $scan.innerHTML=`<div class="scanner">
      <video id="scan-video" playsinline muted autoplay></video>
      <div class="frame"></div><div class="msg" id="scan-msg">カメラを起動しています…</div>
      <div class="foot">
        <label>写真で読み取る<input type="file" accept="image/*" capture="environment" id="scan-file" hidden></label>
        <button onclick="closeScanner()">閉じる</button>
      </div></div>`;
  document.getElementById('scan-file').addEventListener('change', onPhoto);
  try{
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia) throw new Error('no camera api');
    scanStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});
    const v=document.getElementById('scan-video');
    if(!v){ stopStream(); return; }
    v.srcObject=scanStream; await v.play();
    if(!detector && !window.jsQR) throw new Error('no decoder');
    setScanMsg('枠の中にお店のQRコードを写してください');
    let busy=false, lastBad='';
    scanTimer=setInterval(async()=>{
      if(busy||!v.videoWidth) return; busy=true;
      try{
        const text=await decodeFrame(v,v.videoWidth,v.videoHeight);
        if(text && text!==lastBad){ if(!onScanned(text)) lastBad=text; }
      }finally{ busy=false; }
    },250);
  }catch(e){
    stopStream();
    const box=document.querySelector('.scanner'); if(!box) return;
    box.querySelector('video').remove(); box.querySelector('.frame').remove(); box.querySelector('.msg').remove();
    box.insertAdjacentHTML('afterbegin',`<div class="fallback"><div style="font-size:44px">📷</div>
      <p>この画面ではQRコードを読み取れませんでした。</p>
      <p style="font-size:13px;opacity:.85">下の「写真で読み取る」でQRコードを撮影するか、<br>スマホのカメラアプリでQRコードを読み取ってください。</p>
      <p id="scan-msg" style="font-size:13px"></p></div>`);
  }
}
async function onPhoto(ev){
  const file=ev.target.files&&ev.target.files[0]; if(!file) return;
  setScanMsg('読み取り中…');
  try{
    if(!detector) await loadJsQR();
    const img=new Image(); const url=URL.createObjectURL(file);
    await new Promise((res,rej)=>{img.onload=res;img.onerror=rej;img.src=url;});
    const text=await decodeFrame(img,img.naturalWidth,img.naturalHeight);
    URL.revokeObjectURL(url);
    if(!text){ setScanMsg('QRコードが見つかりませんでした。QRが大きく写るように撮り直してください。'); ev.target.value=''; return; }
    if(!onScanned(text)) ev.target.value='';
  }catch(e){ setScanMsg('読み取れませんでした。スマホのカメラアプリでQRコードを読み取ってください。'); }
}
function stopStream(){
  if(scanTimer){ clearInterval(scanTimer); scanTimer=null; }
  if(scanStream){ scanStream.getTracks().forEach(t=>t.stop()); scanStream=null; }
}
function closeScanner(){ stopStream(); $scan.innerHTML=''; }

// 本部で「使用済み」にされたら画面に戻ったときに反映（読み取り中・結果表示中は除く）
document.addEventListener('visibilitychange',()=>{
  if(!document.hidden && currentToken && lastCard && !$scan.innerHTML && !$layer.innerHTML) loadCard();
});

start();
</script>
