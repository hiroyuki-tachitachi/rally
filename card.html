<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>デジタルスタンプラリー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#faf5ec; --card:#fffdf8; --ink:#1f2a44; --muted:#6b6f7b; --line:#e7dcc8;
    --red:#c8372d; --red-soft:#f7e1dc; --gold:#d9a03f; --gold-soft:#fbefd6; --indigo:#2d3e6b;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--paper);color:var(--ink);
    font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;
    -webkit-text-size-adjust:100%}
  .wrap{max-width:520px;margin:0 auto;padding:0 16px 48px}
  header.hero{background:var(--indigo);color:#fff;padding:22px 16px 26px;text-align:center;position:relative;overflow:hidden}
  header.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:10px;
    background:repeating-linear-gradient(90deg,var(--red) 0 18px,#fff 18px 36px)}
  .eyebrow{font-size:11px;letter-spacing:.25em;opacity:.75}
  h1{font-size:21px;margin:6px 0 0;font-weight:900;line-height:1.35}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-top:16px}
  h2{font-size:16px;margin:0 0 12px;font-weight:900}
  label{display:block;font-size:13px;font-weight:700;margin:14px 0 6px}
  input[type=text],input[type=tel],input[type=number]{width:100%;font:inherit;font-size:17px;padding:12px 14px;
    border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
  input:focus{outline:none;border-color:var(--indigo)}
  .note{font-size:12px;color:var(--muted);line-height:1.6}
  .consent{display:flex;gap:10px;align-items:flex-start;margin-top:14px;font-size:13px;line-height:1.6}
  .consent input{width:22px;height:22px;margin-top:1px;flex:none}
  .btn{display:block;width:100%;margin-top:18px;padding:15px;border:0;border-radius:12px;font:inherit;font-weight:900;
    font-size:17px;background:var(--red);color:#fff;cursor:pointer}
  .btn:disabled{opacity:.5}
  .btn.ghost{background:transparent;color:var(--indigo);border:1.5px solid var(--line);font-size:14px;padding:12px}
  .req{color:var(--red);font-weight:900;margin-left:3px}
  .err{color:var(--red);font-size:13px;margin-top:10px;min-height:1em;font-weight:700}
  .loading{text-align:center;padding:60px 0;color:var(--muted)}

  .member{display:flex;justify-content:space-between;align-items:center;gap:12px}
  .member .no{font-size:28px;font-weight:900;letter-spacing:.06em;font-variant-numeric:tabular-nums}
  .member .nm{font-size:14px;color:var(--muted)}
  .member .code{font-size:11px;color:var(--muted);text-align:right;line-height:1.5}
  .member .code b{font-size:15px;color:var(--ink);letter-spacing:.15em}

  .progress-top{display:flex;align-items:baseline;justify-content:space-between}
  .count{font-size:40px;font-weight:900;color:var(--red);line-height:1}
  .count small{font-size:15px;color:var(--muted);font-weight:700}
  .bar{position:relative;height:14px;border-radius:7px;background:#efe6d6;margin:16px 0 26px}
  .bar .fill{position:absolute;inset:0 auto 0 0;border-radius:7px;background:var(--red);transition:width .6s}
  .bar .mk{position:absolute;top:-4px;width:3px;height:22px;background:var(--gold);border-radius:2px}
  .bar .mk span{position:absolute;top:24px;left:50%;transform:translateX(-50%);font-size:11px;white-space:nowrap;color:var(--muted);font-weight:700}

  .ticket{position:relative;border-radius:14px;padding:16px 18px;margin-top:10px;display:flex;justify-content:space-between;align-items:center;gap:10px}
  .ticket.on{background:var(--gold-soft);border:2px solid var(--gold)}
  .ticket.on .t1{color:#8a5a00}
  .ticket.used{background:#f0eeea;border:2px solid #d8d4cc;color:#8a8a8a}
  .ticket.lock{border:2px dashed var(--line);color:var(--muted)}
  .ticket .t1{font-size:12px;font-weight:700}
  .ticket .t2{font-size:19px;font-weight:900;margin-top:2px}
  .ticket .t3{font-size:12px;margin-top:4px;line-height:1.5}
  .ticket .usedmark{border:3px solid #a33;color:#a33;border-radius:8px;padding:4px 8px;font-weight:900;font-size:16px;transform:rotate(-12deg);flex:none;background:rgba(255,255,255,.6)}
  .ticket .go{flex:none;font-size:30px}

  .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
  .cell{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
  .dot{width:100%;aspect-ratio:1;border-radius:50%;border:1.5px dashed #d6cab3;display:flex;align-items:center;justify-content:center;
    font-size:13px;font-weight:700;color:#b3a78f;font-variant-numeric:tabular-nums}
  .cell.on .dot{border:2.5px solid var(--red);color:var(--red);background:var(--red-soft);font-size:15px;font-weight:900}
  .cell .sn{font-size:9.5px;line-height:1.2;color:var(--muted);text-align:center;width:100%;overflow:hidden;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;min-height:2.4em}
  .cell.on .sn{color:var(--ink)}
  .howto{display:flex;gap:12px;align-items:center;font-size:13px;line-height:1.6}
  .howto .ic{font-size:26px;flex:none}

  /* スタンプ結果のオーバーレイ */
  .overlay{position:fixed;inset:0;background:rgba(31,42,68,.55);display:flex;align-items:center;justify-content:center;z-index:10;padding:24px}
  .modal{background:var(--card);border-radius:20px;padding:28px 22px 20px;max-width:360px;width:100%;text-align:center}
  .bigstamp{width:150px;height:150px;margin:0 auto 14px;border-radius:50%;border:6px double var(--red);color:var(--red);
    display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;transform:rotate(-8deg);
    animation:press .45s cubic-bezier(.2,1.6,.4,1) both;padding:10px}
  .bigstamp .s1{font-size:15px;line-height:1.3;word-break:break-all}
  .bigstamp .s2{font-size:26px;margin-top:4px}
  .bigstamp.gray{border-color:#999;color:#888}
  @keyframes press{from{transform:scale(2.2) rotate(-8deg);opacity:0}to{transform:scale(1) rotate(-8deg);opacity:1}}
  .modal h3{margin:4px 0 8px;font-size:19px}
  .modal p{margin:0;font-size:14px;color:var(--muted);line-height:1.6}
  .prize{margin-top:14px;background:var(--gold-soft);border:2px solid var(--gold);border-radius:12px;padding:12px;font-weight:900;color:#8a5a00}
  .linkish{background:none;border:0;color:var(--indigo);text-decoration:underline;font:inherit;font-size:14px;margin-top:14px;cursor:pointer}
</style>
</head>
<body>
<header class="hero">
  <div class="eyebrow">DIGITAL STAMP RALLY</div>
  <h1 id="title"></h1>
</header>
<main class="wrap" id="app"><div class="loading">読み込み中…</div></main>
<div id="layer"></div>

<script>
// ▼▼▼ ここに Apps Script の「ウェブアプリのURL」を貼り付けてください ▼▼▼
const API_URL = 'https://script.google.com/macros/s/AKfycbxzjAEfGum3OQuw1-mdhwzGIRyu374MTTVZI1EwNpuBTGHJ1-S0W_Cj6r1zsEDSPmw8Iw/exec';
// ▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲
const _q = new URLSearchParams(location.search);
const BOOT = {eventName:'', privacy:'', tiers:[], frontUrl:'', shop:_q.get('shop')||'', k:_q.get('k')||'', t:_q.get('t')||''};
const LS_KEY = 'shotengai_rally_token';
const $app = document.getElementById('app');
const $layer = document.getElementById('layer');
document.getElementById('title').textContent = BOOT.eventName;

let currentToken = '';
let lastCard = null;

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
// 端末に会員の合言葉を保存（localStorage と Cookie の二重保存）
function getToken(){
  let t=''; try{t=localStorage.getItem(LS_KEY)||'';}catch(e){}
  if(!t){ const m=document.cookie.match(/(?:^|; )rally_t=([^;]+)/); if(m) t=decodeURIComponent(m[1]); }
  return t;
}
function setToken(t){
  try{t?localStorage.setItem(LS_KEY,t):localStorage.removeItem(LS_KEY);}catch(e){}
  document.cookie='rally_t='+(t?encodeURIComponent(t):'')+';path=/;max-age='+(t?60*60*24*365:0)+';SameSite=Lax'+(location.protocol==='https:'?';Secure':'');
}
// Apps Script（データ保存側）との通信
async function run(fn){
  const args=[].slice.call(arguments,1);
  const action=fn.replace(/^api/,'').replace(/^./,ch=>ch.toLowerCase());
  const res=await fetch(API_URL,{method:'POST',body:JSON.stringify({action:action,args:args})});
  if(!res.ok) throw new Error('通信エラー（'+res.status+'）');
  const text=await res.text();
  try{ return JSON.parse(text); }
  catch(e){ throw new Error('サーバーに接続できませんでした。時間をおいて再度お試しください。（運営者の方へ：card.html の API_URL と、Apps Script のデプロイ設定「アクセスできるユーザー：全員」を確認してください）'); }
}
function keepUrl(token){
  // アドレスにカードの合言葉を残す（ブックマークで同じカードを開けるように）
  try{history.replaceState(null,'',location.pathname+'?t='+encodeURIComponent(token));}catch(e){}
}

async function start(){
  try{
    const cfg=await run('apiConfig');
    BOOT.eventName=cfg.eventName; BOOT.privacy=cfg.privacy; BOOT.tiers=cfg.tiers;
    document.getElementById('title').textContent=cfg.eventName; document.title=cfg.eventName;
  }catch(e){ renderError(e); return; }
  if(BOOT.frontUrl){
    const q=new URLSearchParams(); ['shop','k','t'].forEach(n=>{ if(BOOT[n]) q.set(n,BOOT[n]); });
    const url=BOOT.frontUrl+(q.toString()?'?'+q.toString():'');
    $app.innerHTML='<div class="panel" style="text-align:center"><h2>スタンプカードはこちら</h2><a class="btn" style="text-decoration:none" target="_top" href="'+esc(url)+'">スタンプカードを開く</a></div>';
    return;
  }
  if(BOOT.t) setToken(BOOT.t);
  currentToken = getToken();
  if(!currentToken){ renderRegister(); return; }
  if(BOOT.shop){ await stamp(); } else { await loadCard(); }
}

async function loadCard(){
  try{
    const r = await run('apiCard', currentToken);
    if(r.error==='NOT_FOUND'){ setToken(''); currentToken=''; renderRegister(); return; }
    if(r.error){ renderError(r.error); return; }
    keepUrl(currentToken);
    renderCard(r.card);
  }catch(e){ renderError(e); }
}

async function stamp(){
  $app.innerHTML='<div class="loading">スタンプを押しています…</div>';
  try{
    const r = await run('apiStamp', currentToken, BOOT.shop, BOOT.k);
    if(r.error==='NOT_FOUND'){ setToken(''); currentToken=''; renderRegister(); return; }
    if(r.error){ renderError(r.error); return; }
    BOOT.shop=''; BOOT.k='';
    keepUrl(currentToken);
    renderCard(r.card);
    showResult(r);
  }catch(e){ renderError(e); }
}

function renderError(e){
  $app.innerHTML='<div class="panel"><h2>うまく読み込めませんでした</h2><p class="note">'+esc(e&&e.message?e.message:e)+'</p><button class="btn" onclick="location.reload()">もう一度読み込む</button></div>';
}

// ---------- 登録 ----------
function renderRegister(){
  const fromShop = !!BOOT.shop;
  $app.innerHTML = `<div class="panel"><h2>登録済みの方</h2><p class="note">別のスマホや、LINEなど別のアプリで開いた場合は、登録した電話番号と年齢でカードを開けます。</p><button class="btn ghost" onclick="renderRecover()">登録済みのカードを開く</button></div>` + `
  <div class="panel">
    <h2>はじめての方：参加登録</h2>
    <p class="note">${fromShop?'スタンプを押す前に、まずは参加登録をお願いします。登録が終わるとこのお店のスタンプが自動で押されます。':'登録するとデジタルスタンプカードがもらえます。お店のQRコードを読み取ってスタンプを集めましょう。'}</p>
    <form id="reg" autocomplete="on">
      <p class="note" style="margin:10px 0 0"><span class="req">※</span>はすべて入力必須です</p>
      <label for="f-name">お名前<span class="req">※</span></label>
      <input id="f-name" type="text" name="name" autocomplete="name" placeholder="商店 太郎" required>
      <label for="f-phone">電話番号<span class="req">※</span></label>
      <input id="f-phone" type="tel" name="phone" autocomplete="tel" inputmode="tel" placeholder="090-1234-5678" required>
      <label for="f-city">お住まいの市<span class="req">※</span></label>
      <input id="f-city" type="text" name="city" placeholder="〇〇市" required>
      <label for="f-age">年齢<span class="req">※</span></label>
      <input id="f-age" type="number" name="age" inputmode="numeric" min="0" max="120" placeholder="35" required>
      <label class="consent"><input type="checkbox" name="consent" id="f-consent"><span>${esc(BOOT.privacy)} 上記に同意します。<span class="req">※</span></span></label>
      <div class="err" id="reg-err"></div>
      <button class="btn" type="submit" id="reg-btn">登録してスタンプカードをもらう</button>
    </form>
  </div>
`;
  document.getElementById('reg').addEventListener('submit', async ev=>{
    ev.preventDefault();
    const f = ev.target, btn = document.getElementById('reg-btn'), err = document.getElementById('reg-err');
    err.textContent=''; btn.disabled=true; btn.textContent='登録中…';
    try{
      const r = await run('apiRegister',{name:f.name.value,phone:f.phone.value,city:f.city.value,age:f.age.value,consent:f.consent.checked});
      if(r.error){ err.textContent=r.error; btn.disabled=false; btn.textContent='登録してスタンプカードをもらう'; return; }
      currentToken=r.token; setToken(r.token);
      if(BOOT.shop){ await stamp(); } else { keepUrl(r.token); renderCard(r.card); welcome(r.card); }
    }catch(e){ err.textContent='通信エラーが発生しました。もう一度お試しください。'; btn.disabled=false; btn.textContent='登録してスタンプカードをもらう'; }
  });
}

function renderRecover(){
  $app.innerHTML = `
  <div class="panel">
    <h2>登録済みのカードを開く</h2>
    <form id="rec">
      <label for="r-phone">登録した電話番号<span class="req">※</span></label>
      <input id="r-phone" type="tel" name="phone" inputmode="tel" required>
      <label for="r-age">登録した年齢<span class="req">※</span></label>
      <input id="r-age" type="number" name="age" inputmode="numeric" min="0" max="120" required>
      <div class="err" id="rec-err"></div>
      <button class="btn" type="submit" id="rec-btn">カードを開く</button>
    </form>
    <p class="note" style="margin-top:14px">開けない場合は、商店街本部でお名前と電話番号をお伝えください。</p>
    <button class="btn ghost" onclick="renderRegister()">戻る</button>
  </div>`;
  document.getElementById('rec').addEventListener('submit', async ev=>{
    ev.preventDefault();
    const f=ev.target, err=document.getElementById('rec-err'), btn=document.getElementById('rec-btn');
    err.textContent=''; btn.disabled=true;
    try{
      const r = await run('apiRecover', f.phone.value, f.age.value);
      if(r.error){ err.textContent=r.error; btn.disabled=false; return; }
      currentToken=r.token; setToken(r.token);
      if(BOOT.shop) await stamp(); else await loadCard();
    }catch(e){ err.textContent='通信エラーが発生しました。'; btn.disabled=false; }
  });
}

// ---------- スタンプカード ----------
function renderCard(card){
  lastCard = card;
  const total = card.shops.length;
  const stampedSet = {}; card.stamped.forEach(s=>stampedSet[s.shop]=s.at);
  const count = card.shops.filter(s=>stampedSet[s.id]).length;
  const pct = total? Math.min(100, count/total*100):0;
  const rightsByTier = {}; card.rights.forEach(r=>rightsByTier[r.tier]=r);

  const markers = card.tiers.map(t=>`<div class="mk" style="left:calc(${t/total*100}% - 1.5px)"><span>${t}店舗 🎁</span></div>`).join('');

  const tickets = card.tiers.map((t,i)=>{
    const r = rightsByTier[t];
    if(!r) return `<div class="ticket lock"><div><div class="t1">福引券 ${i+1}回目</div><div class="t2">${t}店舗で獲得</div><div class="t3">あと ${Math.max(0,t-count)} 店舗</div></div><div class="go">🔒</div></div>`;
    if(r.status==='使用済み') return `<div class="ticket used"><div><div class="t1">福引券 ${i+1}回目（${t}店舗達成）</div><div class="t2">福引済み</div><div class="t3">${esc(r.usedAt)}</div></div><div class="usedmark">使用済</div></div>`;
    return `<div class="ticket on"><div><div class="t1">福引券 ${i+1}回目（${t}店舗達成）</div><div class="t2">福引できます！</div><div class="t3">商店街本部でこの画面をスタッフにお見せください</div></div><div class="go">🎁</div></div>`;
  }).join('');

  const cells = card.shops.map((s,i)=>{
    const on = !!stampedSet[s.id];
    return `<div class="cell ${on?'on':''}"><div class="dot">${on?'済':(i+1)}</div><div class="sn">${esc(s.name)}</div></div>`;
  }).join('');

  $app.innerHTML = `
  <div class="panel member">
    <div><div class="nm">会員番号</div><div class="no">${esc(card.member.id)}</div><div class="nm">${esc(card.member.name)} 様</div></div>
    <div class="code">別のスマホで開くときは<br><b style="letter-spacing:0;font-size:12px">電話番号＋年齢</b><br>で開けます</div>
  </div>
  <div class="panel">
    <div class="progress-top"><h2 style="margin:0">スタンプ</h2><div class="count">${count}<small> / ${total} 店舗</small></div></div>
    <div class="bar"><div class="fill" style="width:${pct}%"></div>${markers}</div>
    ${tickets}
  </div>
  <div class="panel howto"><div class="ic">📷</div><div>お店に掲示されたQRコードを<b>スマホのカメラ</b>で読み取ると、スタンプが押されます。</div></div>
  <div class="panel"><h2>スタンプカード</h2><div class="grid">${cells}</div></div>
  <p class="note" style="text-align:center;margin-top:18px">このページをブックマークしておくと、すぐにカードを開けます。</p>`;
}

function showResult(r){
  let html='';
  if(r.result==='OK'){
    html=`<div class="bigstamp"><div class="s1">${esc(r.shopName)}</div><div class="s2">GET!</div></div><h3>スタンプを押しました</h3><p>ご来店ありがとうございます。</p>`;
  }else if(r.result==='ALREADY'){
    html=`<div class="bigstamp gray"><div class="s1">${esc(r.shopName)}</div><div class="s2">済</div></div><h3>このお店はスタンプ済みです</h3><p>スタンプは1店舗につき1回です。</p>`;
  }else{
    html=`<h3>QRコードを確認できませんでした</h3><p>お店に掲示されたQRコードをもう一度読み取ってください。</p>`;
  }
  (r.newRights||[]).forEach(t=>{ html+=`<div class="prize">🎉 ${t}店舗達成！福引券をゲット<br><span style="font-weight:700;font-size:13px">商店街本部で福引ができます</span></div>`; });
  openModal(html);
}

function welcome(card){
  openModal(`<div style="font-size:48px">🏮</div><h3>登録ありがとうございます</h3><p>会員番号は <b>${esc(card.member.id)}</b> です。<br>お店のQRコードを読み取ってスタンプを集めましょう。</p>`);
}

function openModal(inner){
  $layer.innerHTML=`<div class="overlay" onclick="closeModal(event)"><div class="modal">${inner}<button class="btn" onclick="closeModal()">カードを見る</button></div></div>`;
}
function closeModal(ev){ if(ev && ev.target!==ev.currentTarget) return; $layer.innerHTML=''; }

// 本部で「使用済み」にされたら画面に戻ったときに反映
document.addEventListener('visibilitychange',()=>{ if(!document.hidden && currentToken && lastCard) loadCard(); });

start();
</script>
</body>
</html>
